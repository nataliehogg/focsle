[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "focsle"
version = "0.1.0"
description = "Fisher Forecasting for Cosmological Strong Lensing Experiments"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "jax[cuda12]",
    "jaxlib",
    "camb",
    "matplotlib",
    "h5py",  # New-format loscov datasets store covariance blocks as HDF5
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=7.0",
    "scipy",  # Needed for test comparisons
    "chainconsumer",  # Optional cross-check for the native ellipse plotter
    "hankel",  # Optional cross-check for the Ogata Hankel transforms (loscov's transform)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focsle = ["data/*.txt"]
